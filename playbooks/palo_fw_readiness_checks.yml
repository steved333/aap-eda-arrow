---
- name: Configure Palo Alto Firewall
  hosts: palo_alto_firewalls
  connection: local
  gather_facts: false

  collections:
    - paloaltonetworks.panos

  vars:
    provider:
      ip_address: "{{ ansible_host }}"
      username: "{{ palo_username }}"
      password: "{{ palo_password }}"

  tasks:
    - name: Check firewall is accessible
      paloaltonetworks.panos.panos_check:
        provider: "{{ provider }}"
      register: result
      retries: 5
      delay: 5
      until: result is not failed

    - name: Run management plane readiness checks
      paloaltonetworks.panos.panos_readiness_checks:
        provider: "{{ provider }}"
        checks:
          - panorama
          - ntp_sync
          - candidate_config
          - content_version
          - active_support
      ignore_errors: true
      register: readiness_results

    - name: Display readiness check results
      debug:
        var: readiness_results
